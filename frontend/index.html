<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RHoSAM Supermarket POS</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RHoSAM POS" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="description" content="Full-stack supermarket Point of Sale platform with inventory, sales, and business intelligence" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker with update handling
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            const reg = await navigator.serviceWorker.register("/sw.js");
            console.log("[PWA] SW registered:", reg.scope);

            // Check for updates periodically
            reg.addEventListener("updatefound", () => {
              const newWorker = reg.installing;
              console.log("[PWA] New SW installing...");
              newWorker.addEventListener("statechange", () => {
                if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                  // New content available — dispatch event for React banner
                  console.log("[PWA] New version available");
                  window.dispatchEvent(new CustomEvent("sw-update-available", { detail: { worker: newWorker } }));
                }
              });
            });

            // Listen for sync complete messages
            navigator.serviceWorker.addEventListener("message", (event) => {
              if (event.data?.type === "SYNC_COMPLETE") {
                console.log("[PWA] Background sync complete");
                window.dispatchEvent(new CustomEvent("sw-sync-complete"));
              }
            });
          } catch (err) {
            console.log("[PWA] SW registration failed:", err);
          }
        });
      }
    </script>
  </body>
</html>
