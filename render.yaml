# ═══════════════════════════════════════════════════════════════════
# RHoSAM Supermarket — Render Blueprint Configuration
# Deploy both backend and frontend with one click
# ═══════════════════════════════════════════════════════════════════

services:
  # ── Backend API ─────────────────────────────────────────────────
  - type: web
    name: rhosam-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rhosam-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 5000
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_PHONE_NUMBER
        sync: false

  # ── Frontend SPA ────────────────────────────────────────────────
  - type: web
    name: rhosam-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        fromService:
          name: rhosam-backend
          property: host
          type: web

# ── Database ──────────────────────────────────────────────────────
databases:
  - name: rhosam-db
    plan: free
    databaseName: rhosam_supermarket
    ipAllowList: []
